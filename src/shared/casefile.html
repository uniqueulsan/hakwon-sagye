<section class="cfbar no-print" aria-label="의뢰 파일">
  <div class="cfrow">
    <span class="cflab">의뢰 파일</span><b id="cfName">열린 의뢰 없음</b><span class="cfdate" id="cfDate"></span>
    <span class="cfsp"></span>
    <button class="cfbtn" id="cfCopy" type="button">의뢰 파일 복사</button>
    <button class="cfbtn ghost" id="cfOpenBtn" type="button" aria-expanded="false" aria-controls="cfPanel">의뢰 파일 열기</button>
  </div>
  <div class="cfpanel" id="cfPanel" hidden>
    <p class="cfhelp">'의뢰 파일 복사'로 받은 글이나 진단 앱의 '결과 텍스트'를 붙여 넣거나, 저장해 둔 .txt 파일을 고르세요. 진단 결과·검증표·손익 시트·개원 플래너 값이 한 파일에 함께 담겨 있어서, 이 화면에 필요한 값은 자동으로 채워집니다.</p>
    <label class="cfl" for="cfText">붙여 넣기</label>
    <textarea id="cfText" rows="4" placeholder="[학원四季 의뢰 파일 v1] 또는 [학원 경영 진단 결과지]로 시작하는 글"></textarea>
    <div class="cfrow">
      <label class="cfbtn ghost cffile" for="cfFile">.txt 파일 고르기</label><input id="cfFile" type="file" accept=".txt,.json,text/plain,application/json">
      <span class="cfsp"></span>
      <button class="cfbtn" id="cfLoad" type="button">이 의뢰로 열기</button>
    </div>
    <p class="cfwarn">의뢰 파일에는 의뢰인 정보가 들어 있습니다. 메모장이나 '나와의 채팅'처럼 원장님만 보는 곳에 보관하고, 단체방이나 다른 사람에게 보내지 마세요.</p>
  </div>
  <textarea id="cfOut" class="cfout" rows="3" readonly hidden aria-label="복사할 의뢰 파일"></textarea>
</section>
