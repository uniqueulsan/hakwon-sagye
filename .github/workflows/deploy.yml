# 저장소가 바뀌면 → 학원四季사계 사이트를 Cloudflare Pages(hakwon-sagye.pages.dev)에 배포
# 비밀번호 잠금: functions/_middleware.js — 비밀번호는 GitHub Secrets 'SAGYE_SITE_PASSWORD' 에만 둡니다.
# 비밀번호 없이 열 경로(선택): GitHub Variables 'SAGYE_PUBLIC_PATHS' 예) /,/diagnosis/
name: 학원사계 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Cloudflare Pages 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 04d317212c3c5b45875112ffd6eb83c7
          SITE_PW: ${{ secrets.SAGYE_SITE_PASSWORD }}
          PUBLIC_PATHS: ${{ vars.SAGYE_PUBLIC_PATHS }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::비밀값 CLOUDFLARE_API_TOKEN 이 없습니다"; exit 1; fi
          npx --yes wrangler@3 pages project create hakwon-sagye --production-branch main || echo "이미 있는 프로젝트"
          if [ -n "$SITE_PW" ]; then
            printf %s "$SITE_PW" | npx --yes wrangler@3 pages secret put SITE_PASSWORD --project-name hakwon-sagye
          else
            echo "::warning::SAGYE_SITE_PASSWORD 가 없어 사이트가 '준비 중(503)' 잠금 상태로 열립니다"
          fi
          printf %s "${PUBLIC_PATHS:- }" | npx --yes wrangler@3 pages secret put PUBLIC_PATHS --project-name hakwon-sagye
          npx --yes wrangler@3 pages deploy dist --project-name hakwon-sagye --branch main --commit-dirty=true
